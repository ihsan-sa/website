<text class="dg-l" font-size="11.33" font-style="italic" fill="#4A4740" paint-order="stroke" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="round" x="412" y="30" text-anchor="middle">pass</text>
<text class="dg-l hot" font-size="11.33" font-style="italic" fill="#9C4221" paint-order="stroke" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="round" x="348" y="106" text-anchor="start">fail</text>
