<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553 220" width="553" height="220" font-family="'Source Serif 4', 'Source Serif Pro', Georgia, serif" role="img">
<title>A written brief becomes an order-ready board, checked at every step</title>
<defs><marker id="dg-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8.5" markerHeight="8.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 Z" fill="#77716A"/></marker><marker id="dg-a-hot" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 Z" fill="#9C4221"/></marker><marker id="dg-a-pwr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10.5" markerHeight="10.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 Z" fill="#4A4740"/></marker><marker id="dg-a-tree" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10.5" markerHeight="10.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 Z" fill="#4F6D8A"/></marker></defs>
<rect fill="#FAF8F3" width="553" height="220"/>
<g transform="translate(8.5,8)">
<path class="dg-e" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" d="M104,37 L142.5,37" marker-end="url(#dg-a)"/>
<path class="dg-e" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" d="M248,37 L286.5,37" marker-end="url(#dg-a)"/>
<path class="dg-e" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" d="M392,37 L430.5,37" marker-end="url(#dg-a)"/>
<path class="dg-e fail" fill="none" stroke="#9C4221" stroke-width="1.1" stroke-linejoin="round" d="M340,74 L340,128.5" marker-end="url(#dg-a-hot)"/>
<path class="dg-e dash" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="3.5 3" d="M288,167 L202,167 Q196,167 196,161 L196,75.5" marker-end="url(#dg-a)"/>
<rect class="dg-n io" stroke-width="1.1" fill="#EAEDF1" stroke="#4F6D8A" x="0" y="0" width="104" height="74" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="52" y="25.5" text-anchor="middle">Brief</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="52" y="41.5" text-anchor="middle">written by</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="52" y="57.5" text-anchor="middle">a person</text>
<rect class="dg-n work" stroke-width="1.1" fill="#ECEFEB" stroke="#5E7A5A" x="144" y="0" width="104" height="74" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="196" y="25.5" text-anchor="middle">Design</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="196" y="41.5" text-anchor="middle">schematic,</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="196" y="57.5" text-anchor="middle">layout</text>
<rect class="dg-n gate" stroke-width="1.1" fill="#F3E8E4" stroke="#9C4221" x="288" y="0" width="104" height="74" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="340" y="25.5" text-anchor="middle">Checks</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="340" y="41.5" text-anchor="middle">DRC,</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="340" y="57.5" text-anchor="middle">SPICE, DFM</text>
<rect class="dg-n io" stroke-width="1.1" fill="#EAEDF1" stroke="#4F6D8A" x="432" y="0" width="104" height="74" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="484" y="25.5" text-anchor="middle">Package</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="484" y="41.5" text-anchor="middle">order-ready</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="484" y="57.5" text-anchor="middle">files</text>
